name: Build and Deploy Angular to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js v26.10.0
        uses: actions/setup-node@v4
        with:
          node-version: '26.10.0'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Angular Application
        run: npx ng build --configuration production

      - name: Inject CNAME for Custom Domain
        run: echo "www.smith-lippincott-advertising.com" > dist/sl-marketing-angular/browser/CNAME

      - name: Deploy Compiled Assets to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist/sl-marketing-angular/browser
          branch: gh-pages
          clean: true
